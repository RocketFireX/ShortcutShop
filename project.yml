name: ShortcutsShop
options:
  bundleIdPrefix: com.rocketfirex
  deploymentTarget:
    iOS: "17.0"

targets:
  ShortcutsShop:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rocketfirex.shortcutsshop
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        INFOPLIST_KEY_CFBundleDisplayName: Shortcuts Shop
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
